<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSA Texture Viewer</title>
<style>
  :root { --bg: #11120f; --panel: #1b1d18; --fg: #d8e0c8; --dim: #8a9478; --accent: #f0b43c; --line: #2c3027; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; display: grid;
         grid-template-columns: 340px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 10px; color: var(--accent); letter-spacing: .04em; }
  button { background: var(--accent); color: #1a1405; border: 0; padding: 8px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=search] { width: 100%; margin-top: 10px; padding: 7px 9px; background: var(--bg); color: var(--fg);
                       border: 1px solid var(--line); border-radius: 4px; }
  #status { font-size: 12px; color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
  #list { flex: 1; overflow: auto; font: 12px/1.3 ui-monospace, monospace; }
  #list div { padding: 3px 16px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list div:hover, #list div.sel { background: #2a2e22; color: var(--accent); }
  main { position: relative; min-width: 0; display: grid; grid-template-rows: auto 1fr; }
  #info { padding: 10px 16px; border-bottom: 1px solid var(--line); font: 12px ui-monospace, monospace; color: var(--dim); min-height: 38px; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>BSA TEXTURE VIEWER</h1>
    <button id="pick">Choose Fallout New Vegas folder…</button>
    <input id="filter" type="search" placeholder="filter, e.g. landscape\dirt" disabled>
    <div id="status">Pick the game's install folder. Nothing is uploaded; files are read in place.</div>
  </header>
  <div id="list"></div>
</aside>
<main>
  <div id="info"></div>
  <canvas id="view"></canvas>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
